<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watermark Tool — ToolCrate</title>
<link rel="canonical" href="https://site.toolcrate-tools.workers.dev/watermark-tool.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  .canvas-wrapper {
    width: 100%;
    max-width: 100%;
    height: 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface, #18181b);
    border-radius: 8px;
    margin: 20px 0;
    border: 1px dashed var(--rule, #3f3f46);
    overflow: hidden;
  }
  #previewCanvas {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
  }
  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .control-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .control-group label {
    font-size: 0.85rem;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--ink-muted, #a1a1aa);
  }
  .control-group input[type="text"],
  .control-group input[type="number"],
  .control-group select,
  .control-group input[type="file"] {
    background: var(--surface, #18181b);
    color: var(--ink, #fafafa);
    border: 1px solid var(--rule, #3f3f46);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    outline: none;
  }
  .control-group input[type="color"] {
    background: transparent;
    border: 1px solid var(--rule, #3f3f46);
    height: 42px;
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    padding: 4px;
  }
  .control-group input[type="range"] {
    accent-color: var(--accent, #3b82f6);
    cursor: pointer;
    margin-top: 8px;
  }
  .action-btn {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: var(--accent, #3b82f6);
    color: #ffffff;
    border: none;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }
  .action-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .file-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--accent, #3b82f6);
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <a href="index.html" class="back-link">&larr; Back to All Tools</a>
    <h1>Watermark Tool</h1>
    <p class="tagline">Add custom text watermarks to single images, PDFs, or complete folders locally in your browser.</p>
  </header>

  <main>
    <div class="controls-grid">
      <div class="control-group">
        <label for="uploadMode">Upload Mode</label>
        <select id="uploadMode">
          <option value="files">Single / Multiple Files (Images, PDF)</option>
          <option value="folder">Entire Folder (Bulk Mode)</option>
        </select>
      </div>
      <div class="control-group">
        <label for="fileInput">Select File / Folder</label>
        <input type="file" id="fileInput" multiple accept="image/*,.pdf">
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="previewCanvas"></canvas>
    </div>
    <div id="fileInfo" class="file-badge" style="display:none;"></div>

    <div class="controls-grid">
      <div class="control-group">
        <label for="watermarkText">Watermark Text</label>
        <input type="text" id="watermarkText" value="ToolCrate" placeholder="Type text...">
      </div>
      <div class="control-group">
        <label for="fontSizeInput">Font Size (px)</label>
        <input type="number" id="fontSizeInput" value="48" min="10" max="200">
      </div>
      <div class="control-group">
        <label for="opacityInput">Opacity</label>
        <input type="range" id="opacityInput" min="0.1" max="1" step="0.1" value="0.5">
      </div>
      <div class="control-group">
        <label for="colorInput">Text Color</label>
        <input type="color" id="colorInput" value="#ffffff">
      </div>
    </div>

    <button class="action-btn" id="downloadBtn" disabled>Download Watermarked File(s)</button>
  </main>
</div>

<script src="assets/common.js"></script>
<script>
(function() {
  "use strict";

  const uploadMode = document.getElementById('uploadMode');
  const fileInput = document.getElementById('fileInput');
  const watermarkText = document.getElementById('watermarkText');
  const fontSizeInput = document.getElementById('fontSizeInput');
  const opacityInput = document.getElementById('opacityInput');
  const colorInput = document.getElementById('colorInput');
  const previewCanvas = document.getElementById('previewCanvas');
  const downloadBtn = document.getElementById('downloadBtn');
  const fileInfo = document.getElementById('fileInfo');

  let selectedFiles = [];
  let currentPreviewImage = null;

  uploadMode.addEventListener('change', function() {
    fileInput.value = '';
    selectedFiles = [];
    if (this.value === 'folder') {
      fileInput.setAttribute('webkitdirectory', '');
      fileInput.setAttribute('directory', '');
    } else {
      fileInput.removeAttribute('webkitdirectory');
      fileInput.removeAttribute('directory');
    }
  });

  fileInput.addEventListener('change', function(e) {
    selectedFiles = Array.from(e.target.files);
    if (selectedFiles.length === 0) return;

    fileInfo.style.display = 'block';
    fileInfo.textContent = `${selectedFiles.length} file(s) loaded.`;

    const firstImage = selectedFiles.find(f => f.type.startsWith('image/'));
    if (firstImage) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          currentPreviewImage = img;
          renderPreview();
          downloadBtn.disabled = false;
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(firstImage);
    } else {
      downloadBtn.disabled = false;
    }
  });

  function renderPreview() {
    if (!currentPreviewImage) return;
    const ctx = previewCanvas.getContext('2d');
    previewCanvas.width = currentPreviewImage.naturalWidth;
    previewCanvas.height = currentPreviewImage.naturalHeight;

    ctx.drawImage(currentPreviewImage, 0, 0);

    const text = watermarkText.value || 'ToolCrate';
    const fontSize = parseInt(fontSizeInput.value, 10) || 48;
    const opacity = parseFloat(opacityInput.value) || 0.5;

    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.fillStyle = colorInput.value || '#ffffff';
    ctx.globalAlpha = opacity;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillText(text, previewCanvas.width / 2, previewCanvas.height / 2);
  }

  [watermarkText, fontSizeInput, opacityInput, colorInput].forEach(el => {
    el.addEventListener('input', renderPreview);
  });

  downloadBtn.addEventListener('click', async function() {
    if (selectedFiles.length === 0) return;
    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Processing... Please Wait';

    if (selectedFiles.length === 1 && selectedFiles[0].type.startsWith('image/')) {
      const blob = await processImageWatermark(selectedFiles[0]);
      triggerDownload(blob, `watermarked_${selectedFiles[0].name}`);
    } else {
      const zip = new JSZip();
      for (let file of selectedFiles) {
        if (file.type.startsWith('image/')) {
          const blob = await processImageWatermark(file);
          zip.file(`watermarked_${file.name}`, blob);
        } else if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
          const pdfBytes = await processPDFWatermark(file);
          zip.file(`watermarked_${file.name}`, pdfBytes);
        }
      }
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      triggerDownload(zipBlob, 'watermarked_files.zip');
    }

    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Download Watermarked File(s)';
  });

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function processImageWatermark(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;

          ctx.drawImage(img, 0, 0);

          const text = watermarkText.value || 'ToolCrate';
          const fontSize = parseInt(fontSizeInput.value, 10) || 48;
          const opacity = parseFloat(opacityInput.value) || 0.5;

          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.fillStyle = colorInput.value || '#ffffff';
          ctx.globalAlpha = opacity;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.fillText(text, canvas.width / 2, canvas.height / 2);

          canvas.toBlob((blob) => resolve(blob), file.type || 'image/png');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function processPDFWatermark(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    const pages = pdfDoc.getPages();

    const text = watermarkText.value || 'ToolCrate';
    const opacity = parseFloat(opacityInput.value) || 0.5;

    for (const page of pages) {
      const { width, height } = page.getSize();
      page.drawText(text, {
        x: width / 3,
        y: height / 2,
        size: parseInt(fontSizeInput.value, 10) || 36,
        opacity: opacity,
      });
    }

    return await pdfDoc.save();
  }
})();
</script>
</body>
</html>
