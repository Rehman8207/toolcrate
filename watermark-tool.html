<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watermark Tool — ToolCrate</title>
<link rel="canonical" href="https://site.toolcrate-tools.workers.dev/watermark-tool.html">
<link rel="stylesheet" href="assets/style.css">
<style>
  .tool-container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .canvas-wrapper {
    width: 100% !important;
    max-width: 800px !important;
    height: 400px !important;
    max-height: 50vh !important;
    overflow: hidden !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    background: #111 !important;
    border-radius: 8px !important;
    margin: 15px auto !important;
    border: 1px dashed #444 !important;
  }
  #previewCanvas {
    max-width: 100% !important;
    max-height: 100% !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain !important;
  }
  .controls-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
  .control-group { display: flex; flex-direction: column; gap: 5px; }
  .control-group label { font-size: 0.85rem; font-weight: 500; }
  .control-group input, .control-group button { padding: 8px 12px; border-radius: 4px; border: 1px solid var(--rule, #ccc); }
  .btn-primary { background: var(--accent, #0066cc); color: white; font-weight: 600; cursor: pointer; border: none !important; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <a href="index.html" class="back-link">&larr; Back to All Tools</a>
    <h1>Watermark Tool</h1>
    <p class="tagline">Add custom watermarks locally in your browser without uploading to any server.</p>
  </header>

  <main class="tool-container">
    <div class="control-group">
      <label for="imageInput">Select Image</label>
      <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="canvas-wrapper">
      <canvas id="previewCanvas"></canvas>
    </div>

    <div class="controls-grid">
      <div class="control-group">
        <label for="watermarkText">Watermark Text</label>
        <input type="text" id="watermarkText" value="ToolCrate" placeholder="Type text...">
      </div>
      <div class="control-group">
        <label for="fontSizeInput">Font Size (px)</label>
        <input type="number" id="fontSizeInput" value="48" min="10" max="200">
      </div>
      <div class="control-group">
        <label for="opacityInput">Opacity</label>
        <input type="range" id="opacityInput" min="0.1" max="1" step="0.1" value="0.5">
      </div>
      <div class="control-group">
        <label for="colorInput">Text Color</label>
        <input type="color" id="colorInput" value="#ffffff">
      </div>
    </div>

    <div style="margin-top: 20px;">
      <button class="btn-primary" id="downloadBtn" disabled style="width: 100%; padding: 12px;">Download Watermarked Image</button>
    </div>
  </main>
</div>

<script>
(function() {
  "use strict";

  const imageInput = document.getElementById('imageInput');
  const watermarkText = document.getElementById('watermarkText');
  const opacityInput = document.getElementById('opacityInput');
  const fontSizeInput = document.getElementById('fontSizeInput');
  const colorInput = document.getElementById('colorInput');
  const previewCanvas = document.getElementById('previewCanvas');
  const downloadBtn = document.getElementById('downloadBtn');

  let currentImage = null;
  let renderTimeout = null;

  // Persistent State (SessionStorage)
  function saveState() {
    sessionStorage.setItem('wm_text', watermarkText.value);
    sessionStorage.setItem('wm_size', fontSizeInput.value);
    sessionStorage.setItem('wm_opacity', opacityInput.value);
    sessionStorage.setItem('wm_color', colorInput.value);
  }

  function loadSavedState() {
    if (sessionStorage.getItem('wm_text')) watermarkText.value = sessionStorage.getItem('wm_text');
    if (sessionStorage.getItem('wm_size')) fontSizeInput.value = sessionStorage.getItem('wm_size');
    if (sessionStorage.getItem('wm_opacity')) opacityInput.value = sessionStorage.getItem('wm_opacity');
    if (sessionStorage.getItem('wm_color')) colorInput.value = sessionStorage.getItem('wm_color');

    // Restore Image if stored in Session
    const savedImageSrc = sessionStorage.getItem('wm_img_data');
    if (savedImageSrc) {
      const img = new Image();
      img.onload = function() {
        currentImage = img;
        renderWatermark();
        downloadBtn.disabled = false;
      };
      img.src = savedImageSrc;
    }
  }

  function renderWatermark() {
    if (!currentImage) return;

    const ctx = previewCanvas.getContext('2d', { alpha: false, willReadFrequently: false });
    
    previewCanvas.width = currentImage.naturalWidth;
    previewCanvas.height = currentImage.naturalHeight;

    ctx.drawImage(currentImage, 0, 0);

    const text = watermarkText.value || 'ToolCrate';
    const fontSize = parseInt(fontSizeInput.value, 10) || 48;
    const opacity = parseFloat(opacityInput.value) || 0.5;

    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.fillStyle = colorInput.value || '#ffffff';
    ctx.globalAlpha = opacity;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillText(text, previewCanvas.width / 2, previewCanvas.height / 2);
    saveState();
  }

  function scheduleRender() {
    if (renderTimeout) cancelAnimationFrame(renderTimeout);
    renderTimeout = requestAnimationFrame(renderWatermark);
  }

  function handleImageFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        currentImage = img;
        try {
          sessionStorage.setItem('wm_img_data', event.target.result);
        } catch(e) {}
        renderWatermark();
        downloadBtn.disabled = false;
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  imageInput.addEventListener('change', function(e) {
    handleImageFile(e.target.files[0]);
  });

  watermarkText.addEventListener('input', scheduleRender);
  opacityInput.addEventListener('input', scheduleRender);
  fontSizeInput.addEventListener('input', scheduleRender);
  colorInput.addEventListener('input', scheduleRender);

  downloadBtn.addEventListener('click', function() {
    if (!currentImage) return;
    previewCanvas.toBlob(function(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'watermarked-image.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 'image/png');
  });

  loadSavedState();
})();
</script>
</body>
</html>
