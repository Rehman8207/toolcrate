<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watermark Tool — ToolCrate</title>
<link rel="canonical" href="https://site.toolcrate-tools.workers.dev/watermark-tool.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  .wm-app-grid {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 24px;
    margin-top: 24px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .wm-app-grid { grid-template-columns: 1fr; }
  }
  .wm-card {
    background: var(--surface, #18181b);
    border: 1px solid var(--rule, #27272a);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .wm-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .wm-group label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.8rem;
    color: var(--ink-muted, #a1a1aa);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .wm-group input[type="text"],
  .wm-group input[type="number"],
  .wm-group select,
  .wm-group input[type="file"] {
    background: #09090b;
    color: var(--ink, #fafafa);
    border: 1px solid var(--rule, #3f3f46);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.9rem;
    width: 100%;
    box-sizing: border-box;
    outline: none;
  }
  .wm-group input[type="color"] {
    background: #09090b;
    border: 1px solid var(--rule, #3f3f46);
    height: 42px;
    width: 100%;
    border-radius: 6px;
    cursor: pointer;
    padding: 4px;
  }
  .wm-group input[type="range"] {
    accent-color: var(--accent, #3b82f6);
    cursor: pointer;
  }
  .wm-preview-container {
    background: #09090b;
    border: 1px dashed var(--rule, #3f3f46);
    border-radius: 12px;
    min-height: 440px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 16px;
  }
  #previewCanvas {
    max-width: 100% !important;
    max-height: 420px !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .wm-empty-state {
    text-align: center;
    color: var(--ink-muted, #71717a);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
  }
  .wm-btn-primary {
    background: var(--accent, #3b82f6);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    width: 100%;
    transition: opacity 0.2s;
  }
  .wm-btn-primary:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .wm-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    color: var(--accent, #3b82f6);
    background: rgba(59, 130, 246, 0.1);
    padding: 6px 10px;
    border-radius: 4px;
    display: inline-block;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <a href="index.html" class="back-link">&larr; Back to All Tools</a>
    <h1>Watermark Tool</h1>
    <p class="tagline">Watermark single photos, multi-page PDFs, or complete folders locally on your device. Zero uploads.</p>
  </header>

  <main>
    <div class="wm-app-grid">
      <!-- Left Controls Panel -->
      <div class="wm-card">
        <div class="wm-group">
          <label for="uploadMode">Input Mode</label>
          <select id="uploadMode">
            <option value="files">Single / Multiple Files (Images, PDF)</option>
            <option value="folder">Entire Folder (Bulk)</option>
          </select>
        </div>

        <div class="wm-group">
          <label for="fileInput">Choose Source</label>
          <input type="file" id="fileInput" multiple accept="image/*,.pdf">
        </div>

        <div id="fileBadge" class="wm-badge" style="display:none;"></div>

        <div class="wm-group">
          <label for="watermarkText">Watermark Text</label>
          <input type="text" id="watermarkText" value="ToolCrate" placeholder="Enter text...">
        </div>

        <div class="wm-group">
          <label for="fontSizeInput">Font Size (px)</label>
          <input type="number" id="fontSizeInput" value="48" min="10" max="250">
        </div>

        <div class="wm-group">
          <label for="opacityInput">Opacity</label>
          <input type="range" id="opacityInput" min="0.05" max="1" step="0.05" value="0.5">
        </div>

        <div class="wm-group">
          <label for="colorInput">Text Color</label>
          <input type="color" id="colorInput" value="#ffffff">
        </div>

        <button class="wm-btn-primary" id="downloadBtn" disabled>Process & Download</button>
      </div>

      <!-- Right Interactive Live Preview -->
      <div class="wm-preview-container">
        <canvas id="previewCanvas"></canvas>
        <div id="emptyState" class="wm-empty-state">
          Select an image or PDF to view live watermark preview
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/common.js"></script>
<script>
(function() {
  "use strict";

  const uploadMode = document.getElementById('uploadMode');
  const fileInput = document.getElementById('fileInput');
  const watermarkText = document.getElementById('watermarkText');
  const fontSizeInput = document.getElementById('fontSizeInput');
  const opacityInput = document.getElementById('opacityInput');
  const colorInput = document.getElementById('colorInput');
  const previewCanvas = document.getElementById('previewCanvas');
  const downloadBtn = document.getElementById('downloadBtn');
  const fileBadge = document.getElementById('fileBadge');
  const emptyState = document.getElementById('emptyState');

  let selectedFiles = [];
  let currentPreviewImg = null;

  uploadMode.addEventListener('change', function() {
    fileInput.value = '';
    selectedFiles = [];
    fileBadge.style.display = 'none';
    if (this.value === 'folder') {
      fileInput.setAttribute('webkitdirectory', '');
      fileInput.setAttribute('directory', '');
    } else {
      fileInput.removeAttribute('webkitdirectory');
      fileInput.removeAttribute('directory');
    }
  });

  fileInput.addEventListener('change', function(e) {
    selectedFiles = Array.from(e.target.files);
    if (selectedFiles.length === 0) return;

    fileBadge.style.display = 'inline-block';
    fileBadge.textContent = `${selectedFiles.length} file(s) loaded`;

    const firstImage = selectedFiles.find(f => f.type.startsWith('image/'));
    if (firstImage) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          currentPreviewImg = img;
          emptyState.style.display = 'none';
          renderPreview();
          downloadBtn.disabled = false;
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(firstImage);
    } else {
      emptyState.style.display = 'block';
      emptyState.textContent = 'PDF file(s) loaded. Ready for batch processing.';
      downloadBtn.disabled = false;
    }
  });

  function renderPreview() {
    if (!currentPreviewImg) return;
    const ctx = previewCanvas.getContext('2d');
    previewCanvas.width = currentPreviewImg.naturalWidth;
    previewCanvas.height = currentPreviewImg.naturalHeight;

    ctx.drawImage(currentPreviewImg, 0, 0);

    const text = watermarkText.value || 'ToolCrate';
    const fontSize = parseInt(fontSizeInput.value, 10) || 48;
    const opacity = parseFloat(opacityInput.value) || 0.5;

    ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.fillStyle = colorInput.value || '#ffffff';
    ctx.globalAlpha = opacity;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    ctx.fillText(text, previewCanvas.width / 2, previewCanvas.height / 2);
  }

  [watermarkText, fontSizeInput, opacityInput, colorInput].forEach(el => {
    el.addEventListener('input', renderPreview);
  });

  downloadBtn.addEventListener('click', async function() {
    if (selectedFiles.length === 0) return;
    downloadBtn.disabled = true;
    downloadBtn.textContent = 'Processing...';

    if (selectedFiles.length === 1 && selectedFiles[0].type.startsWith('image/')) {
      const blob = await processImageWatermark(selectedFiles[0]);
      triggerDownload(blob, `watermarked_${selectedFiles[0].name}`);
    } else {
      const zip = new JSZip();
      for (let file of selectedFiles) {
        if (file.type.startsWith('image/')) {
          const blob = await processImageWatermark(file);
          zip.file(`watermarked_${file.name}`, blob);
        } else if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
          const pdfBytes = await processPDFWatermark(file);
          zip.file(`watermarked_${file.name}`, pdfBytes);
        }
      }
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      triggerDownload(zipBlob, 'watermarked_files.zip');
    }

    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Process & Download';
  });

  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function processImageWatermark(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;

          ctx.drawImage(img, 0, 0);

          const text = watermarkText.value || 'ToolCrate';
          const fontSize = parseInt(fontSizeInput.value, 10) || 48;
          const opacity = parseFloat(opacityInput.value) || 0.5;

          ctx.font = `bold ${fontSize}px sans-serif`;
          ctx.fillStyle = colorInput.value || '#ffffff';
          ctx.globalAlpha = opacity;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          ctx.fillText(text, canvas.width / 2, canvas.height / 2);

          canvas.toBlob((blob) => resolve(blob), file.type || 'image/png');
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function processPDFWatermark(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    const pages = pdfDoc.getPages();

    const text = watermarkText.value || 'ToolCrate';
    const opacity = parseFloat(opacityInput.value) || 0.5;

    for (const page of pages) {
      const { width, height } = page.getSize();
      page.drawText(text, {
        x: width / 3,
        y: height / 2,
        size: parseInt(fontSizeInput.value, 10) || 36,
        opacity: opacity,
      });
    }

    return await pdfDoc.save();
  }
})();
</script>
</body>
</html>
