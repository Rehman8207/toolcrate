<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Live Currency Converter — 150+ World Currencies | ToolCrate</title>
<meta name="description" content="Convert live currency exchange rates across 150+ world currencies instantly in your browser. Fast, accurate, free, and 100% private.">
<meta name="keywords" content="currency converter, live exchange rates, dollar to pkr, usd to eur, forex converter, free currency tool">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://site.toolcrate-tools.workers.dev/currency-converter.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "ToolCrate Live Currency Converter",
  "url": "https://site.toolcrate-tools.workers.dev/currency-converter.html",
  "applicationCategory": "FinanceApplication",
  "operatingSystem": "Any"
}
</script>

<style>
  :root{
    --wm-bg: #0c1712;
    --wm-surface: #12211a;
    --wm-surface-2: #17301f;
    --wm-ink: #eef6ee;
    --wm-muted: #9fb9a8;
    --wm-rule: #29452f;
    --wm-accent: #34d399;
    --wm-accent-ink: #06241a;
  }
  body{ background: var(--wm-bg); color: var(--wm-ink); font-family: 'IBM Plex Mono', monospace; }
  .card{ background: var(--wm-surface); border: 1px solid var(--wm-rule); border-radius: 12px; padding: 24px; max-width: 600px; margin: 24px auto; }
  .field{ margin-bottom: 16px; }
  .field label{ display: block; font-size: 0.8rem; color: var(--wm-muted); margin-bottom: 6px; }
  .field input, .field select{ width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--wm-rule); background: var(--wm-bg); color: var(--wm-ink); box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; }
  .row{ display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; }
  .swap-btn{ background: var(--wm-surface-2); border: 1px solid var(--wm-rule); color: var(--wm-ink); padding: 12px; border-radius: 8px; cursor: pointer; font-size: 1.2rem; }
  .res-box{ background: var(--wm-bg); border: 1px solid var(--wm-accent); border-radius: 8px; padding: 20px; text-align: center; margin-top: 20px; }
  .res-val{ font-size: 1.6rem; font-weight: 600; color: var(--wm-accent); font-family: 'IBM Plex Mono', monospace; }
  .res-rate{ font-size: 0.85rem; color: var(--wm-muted); margin-top: 6px; font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="wrap" style="max-width:860px;margin:0 auto;padding:24px;">
  <a href="index.html" style="color:var(--wm-muted);text-decoration:none;">&larr; Back to All Tools</a>
  <h1 style="font-family:'Fraunces',serif;font-size:2.2rem;margin:16px 0 8px;">Live Currency Converter</h1>
  <p style="color:var(--wm-muted);">Real-time exchange rate conversion across 150+ currencies.</p>

  <div class="card">
    <div class="field">
      <label for="amountInput">Amount</label>
      <input type="number" id="amountInput" value="1" min="0" step="any">
    </div>

    <div class="row">
      <div class="field" style="margin:0;"><label for="fromSelect">From</label><select id="fromSelect"></select></div>
      <button class="swap-btn" id="swapBtn" type="button">&#8646;</button>
      <div class="field" style="margin:0;"><label for="toSelect">To</label><select id="toSelect"></select></div>
    </div>

    <div class="res-box">
      <div class="res-val" id="resultVal">Loading rates...</div>
      <div class="res-rate" id="resultRate">Fetching exchange rates</div>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";
  const amountInput = document.getElementById('amountInput');
  const fromSelect = document.getElementById('fromSelect');
  const toSelect = document.getElementById('toSelect');
  const swapBtn = document.getElementById('swapBtn');
  const resultVal = document.getElementById('resultVal');
  const resultRate = document.getElementById('resultRate');
  let ratesData = {};

  const fallbackCurrencies = ["USD", "EUR", "GBP", "PKR", "INR", "CAD", "AUD", "AED", "SAR", "JPY", "CNY"];

  async function fetchRates() {
    try {
      resultVal.textContent = "Loading rates...";
      const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');
      if (!res.ok) throw new Error('Network response failed');
      const data = await res.json();
      ratesData = data.rates;
      populate(Object.keys(ratesData));
      calculate();
    } catch (e) {
      try {
        const res2 = await fetch('https://open.er-api.com/v6/latest/USD');
        const data2 = await res2.json();
        ratesData = data2.rates;
        populate(Object.keys(ratesData));
        calculate();
      } catch (err) {
        resultVal.textContent = "Error loading live rates";
        resultRate.textContent = "Please check network or refresh page";
      }
    }
  }

  function populate(currencies) {
    fromSelect.innerHTML = '';
    toSelect.innerHTML = '';
    currencies.sort().forEach(c => {
      fromSelect.add(new Option(c, c));
      toSelect.add(new Option(c, c));
    });
    fromSelect.value = "USD";
    toSelect.value = currencies.includes("PKR") ? "PKR" : "EUR";
  }

  function calculate() {
    if (!ratesData || !ratesData[fromSelect.value] || !ratesData[toSelect.value]) return;
    const amt = parseFloat(amountInput.value) || 0;
    const rateFrom = ratesData[fromSelect.value];
    const rateTo = ratesData[toSelect.value];
    const converted = (amt / rateFrom) * rateTo;
    const single = (1 / rateFrom) * rateTo;
    resultVal.textContent = `${converted.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})} ${toSelect.value}`;
    resultRate.textContent = `1 ${fromSelect.value} = ${single.toFixed(4)} ${toSelect.value}`;
  }

  amountInput.addEventListener('input', calculate);
  fromSelect.addEventListener('change', calculate);
  toSelect.addEventListener('change', calculate);
  swapBtn.addEventListener('click', () => {
    const t = fromSelect.value;
    fromSelect.value = toSelect.value;
    toSelect.value = t;
    calculate();
  });

  fetchRates();
})();
</script>
</body>
</html>
