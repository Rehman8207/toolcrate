<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Currency Converter — ToolCrate</title>
<link rel="canonical" href="https://site.toolcrate-tools.workers.dev/currency-converter.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .converter-card {
    background: var(--surface, #18181b);
    border: 1px solid var(--rule, #27272a);
    border-radius: 12px;
    padding: 24px;
    max-width: 650px;
    margin: 20px auto;
  }
  .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .input-group label { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; color: var(--ink-muted, #a1a1aa); }
  .input-group input, .input-group select {
    background: #09090b;
    border: 1px solid var(--rule, #27272a);
    color: #fff;
    padding: 12px 14px;
    border-radius: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1rem;
  }
  .currency-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: end; margin-bottom: 20px; }
  .swap-btn {
    background: #27272a;
    border: 1px solid var(--rule, #3f3f46);
    color: #fff;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .result-box {
    background: #09090b;
    border: 1px solid var(--accent, #3b82f6);
    border-radius: 8px;
    padding: 20px;
    text-align: center;
  }
  .result-val { font-size: 1.6rem; font-weight: 600; font-family: 'IBM Plex Mono', monospace; color: #fff; }
  .result-rate { font-size: 0.85rem; color: var(--ink-muted, #a1a1aa); margin-top: 6px; font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <a href="index.html" class="back-link">&larr; Back to All Tools</a>
    <h1>Live Currency Converter</h1>
    <p class="tagline">Convert real-time exchange rates across 150+ world currencies instantly.</p>
  </header>

  <main>
    <div class="converter-card">
      <div class="input-group">
        <label for="amountInput">Amount</label>
        <input type="number" id="amountInput" value="1" min="0" step="any">
      </div>

      <div class="currency-row">
        <div class="input-group" style="margin-bottom:0;">
          <label for="fromSelect">From</label>
          <select id="fromSelect"></select>
        </div>
        <button class="swap-btn" id="swapBtn" type="button">&#8646;</button>
        <div class="input-group" style="margin-bottom:0;">
          <label for="toSelect">To</label>
          <select id="toSelect"></select>
        </div>
      </div>

      <div class="result-box">
        <div class="result-val" id="resultVal">Loading rates...</div>
        <div class="result-rate" id="resultRate">Fetching latest exchange rates</div>
      </div>
    </div>
  </main>
</div>

<script src="assets/common.js"></script>
<script>
(function() {
  "use strict";

  const amountInput = document.getElementById('amountInput');
  const fromSelect = document.getElementById('fromSelect');
  const toSelect = document.getElementById('toSelect');
  const swapBtn = document.getElementById('swapBtn');
  const resultVal = document.getElementById('resultVal');
  const resultRate = document.getElementById('resultRate');

  let ratesData = {};
  const defaultCurrencies = ["USD", "EUR", "GBP", "PKR", "INR", "CAD", "AUD", "AED", "SAR", "JPY", "CNY"];

  async function fetchRates() {
    try {
      resultVal.textContent = "Loading rates...";
      const res = await fetch('https://open.er-api.com/v6/latest/USD');
      if (!res.ok) throw new Error('Network error');
      const data = await res.json();
      ratesData = data.rates;
      populateDropdowns(Object.keys(ratesData));
      calculate();
    } catch (err) {
      resultVal.textContent = "Error loading live rates";
      resultRate.textContent = "Please check your network connection.";
    }
  }

  function populateDropdowns(currencies) {
    fromSelect.innerHTML = '';
    toSelect.innerHTML = '';
    currencies.sort().forEach(curr => {
      const opt1 = new Option(curr, curr);
      const opt2 = new Option(curr, curr);
      fromSelect.add(opt1);
      toSelect.add(opt2);
    });

    fromSelect.value = "USD";
    toSelect.value = currencies.includes("PKR") ? "PKR" : "EUR";
  }

  function calculate() {
    if (!ratesData || Object.keys(ratesData).length === 0) return;
    const amount = parseFloat(amountInput.value) || 0;
    const from = fromSelect.value;
    const to = toSelect.value;

    const rateFromUSD = ratesData[from];
    const rateToUSD = ratesData[to];

    if (!rateFromUSD || !rateToUSD) return;

    const converted = (amount / rateFromUSD) * rateToUSD;
    const singleRate = (1 / rateFromUSD) * rateToUSD;

    resultVal.textContent = `${converted.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})} ${to}`;
    resultRate.textContent = `1 ${from} = ${singleRate.toFixed(4)} ${to}`;
  }

  amountInput.addEventListener('input', calculate);
  fromSelect.addEventListener('change', calculate);
  toSelect.addEventListener('change', calculate);

  swapBtn.addEventListener('click', function() {
    const temp = fromSelect.value;
    fromSelect.value = toSelect.value;
    toSelect.value = temp;
    calculate();
  });

  fetchRates();
})();
</script>
</body>
</html>
